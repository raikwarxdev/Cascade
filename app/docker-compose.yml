services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend-fastapi:
    build: ./backend-fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./backend-fastapi/app:/app/app
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      - qdrant

  backend-node:
    build: ./backend-node
    ports:
      - "4000:4000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - FASTAPI_URL=http://backend-fastapi:8000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_FASTAPI_API=http://localhost:8000
      - NEXT_PUBLIC_NODE_API=http://localhost:4000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - backend-fastapi
      - backend-node

volumes:
  qdrant_data:
